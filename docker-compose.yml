services:
  engine:
    build: ./engine
    ports:
      - "3001:3001"
    environment:
      LOGGER: "true"
      BOTS: "true"
    volumes:
      - engine-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - "3000:3000"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine-data: